<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alumni Check-in | Ultra HD QR Standee</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #060d18;
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      color: #FDFDFD;
    }
    .poster {
      background: linear-gradient(145deg, #0A192F 0%, #0e223d 100%);
      border: 2px solid rgba(218, 165, 32, 0.4);
      border-radius: 28px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6), 0 0 80px rgba(218, 165, 32, 0.12);
      width: 100%;
      max-width: 520px;
      padding: 48px 36px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .poster::before {
      content: "";
      position: absolute;
      top: -120px;
      left: 50%;
      transform: translateX(-50%);
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(218, 165, 32, 0.18) 0%, transparent 70%);
      pointer-events: none;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(218, 165, 32, 0.12);
      border: 1px solid rgba(218, 165, 32, 0.35);
      color: #DFBA73;
      padding: 6px 16px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 20px;
    }
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 34px;
      font-weight: 700;
      color: #FDFDFD;
      line-height: 1.25;
      margin-bottom: 10px;
      letter-spacing: -0.5px;
    }
    h1 span {
      background: linear-gradient(135deg, #F1D78A 0%, #DFBA73 50%, #C5A059 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p.subtitle {
      color: #B0C4DE;
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 32px;
    }
    .qr-frame {
      background: #FFFFFF;
      padding: 20px;
      border-radius: 22px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.2);
      display: inline-block;
      margin: 0 auto 28px;
      max-width: 300px;
      width: 100%;
    }
    .qr-frame svg {
      width: 100%;
      height: auto;
      display: block;
    }
    .instructions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: rgba(14, 34, 61, 0.8);
      border: 1px solid rgba(176, 196, 222, 0.18);
      border-radius: 14px;
      padding: 12px 18px;
      margin-bottom: 24px;
    }
    .instructions span {
      font-size: 14px;
      font-weight: 600;
      color: #FDFDFD;
    }
    .instructions .icon {
      font-size: 18px;
    }
    .url-chip {
      color: #DFBA73;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      word-break: break-all;
      opacity: 0.9;
    }
    .actions {
      margin-top: 24px;
      display: flex;
      gap: 12px;
      justify-content: center;
    }
    .btn {
      background: #DFBA73;
      color: #0A192F;
      font-weight: 700;
      font-size: 14px;
      padding: 10px 22px;
      border-radius: 9999px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn:hover {
      background: #F1D78A;
      transform: translateY(-2px);
    }
    .btn-outline {
      background: transparent;
      color: #DFBA73;
      border: 1px solid rgba(218, 165, 32, 0.5);
    }
    .btn-outline:hover {
      background: rgba(218, 165, 32, 0.1);
    }
    @media print {
      body {
        background: transparent;
        padding: 0;
      }
      .actions { display: none !important; }
      .poster {
        box-shadow: none;
        max-width: 100%;
        border-radius: 0;
        page-break-inside: avoid;
      }
    }
  </style>
</head>

    </div>

    <div>
