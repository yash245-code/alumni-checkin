<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Alumni Check-In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: linear-gradient(145deg, #090d16 0%, #0f172a 50%, #1e1b4b 100%);
      --card-bg: rgba(255, 255, 255, 0.96);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #4f46e5;
      --primary-active: #3730a3;
      --primary-gradient: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%);
      --error-bg: #fef2f2;
      --error-border: #fecaca;
      --error-text: #b91c1c;
      --success-glow: rgba(79, 70, 229, 0.15);
      --radius: 14px;
      --transition: 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      width: 100%;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      overflow-x: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    /* Single centered card, max-w-sm (384px), full width on mobile, p-6 (24px) */
    .card {
      width: 100%;
      max-width: 384px;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.15);
      position: relative;
      overflow: hidden;
    }

    /* Header styling */
    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .event-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      background: #eef2ff;
      color: #4338ca;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-radius: 9999px;
      margin-bottom: 12px;
      border: 1px solid #e0e7ff;
    }

    .event-badge .dot {
      width: 6px;
      height: 6px;
      background: #4f46e5;
      border-radius: 50%;
    }

    .title {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 24px;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.02em;
      line-height: 1.2;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    /* Form & Input controls */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .input-wrapper {
      position: relative;
      width: 100%;
    }

    /* Input: h-12 minimum (48px+), full width, rounded-lg, text-base (16px) */
    .input-field {
      width: 100%;
      min-height: 52px;
      padding: 0 16px 0 46px;
      font-size: 16px; /* 16px prevents iOS zoom on focus */
      font-family: inherit;
      color: #0f172a;
      background: #f8fafc;
      border: 1.5px solid #e2e8f0;
      border-radius: var(--radius);
      outline: none;
      transition: border-color var(--transition), box-shadow var(--transition);
      appearance: none;
      -webkit-appearance: none;
    }

    .input-icon {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      width: 20px;
      height: 20px;
      color: #94a3b8;
      pointer-events: none;
      transition: color var(--transition);
    }

    .input-field:focus {
      border-color: var(--primary);
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.12);
    }

    .input-field:focus + .input-icon {
      color: var(--primary);
    }

    /* Error alert below input */
    .error-alert {
      display: none;
      align-items: flex-start;
      gap: 10px;
      background: var(--error-bg);
      border: 1px solid var(--error-border);
      color: var(--error-text);
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 13.5px;
      line-height: 1.4;
      animation: alertSlide 0.25s ease-out;
    }

    .error-alert svg {
      flex-shrink: 0;
      width: 18px;
      height: 18px;
      margin-top: 1px;
    }

    @keyframes alertSlide {
      0% { opacity: 0; transform: translateY(-6px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* Button: h-12 minimum (48px+), full width, rounded-lg, text-base */
    /* No hover-only states; use active for tap feedback */
    .submit-btn {
      width: 100%;
      min-height: 52px;
      background: var(--primary-gradient);
      color: #ffffff;
      font-size: 16px;
      font-weight: 600;
      font-family: inherit;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 4px 14px 0 rgba(79, 70, 229, 0.35);
      transition: transform var(--transition), opacity var(--transition), box-shadow var(--transition);
      touch-action: manipulation;
    }

    /* Mobile tap feedback using :active */
    .submit-btn:active {
      transform: scale(0.97);
      background: var(--primary-active);
      box-shadow: 0 2px 6px 0 rgba(79, 70, 229, 0.3);
    }

    .submit-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none !important;
    }

    /* Spinner */
    .spinner {
      display: none;
      width: 20px;
      height: 20px;
      border: 2.5px solid rgba(255, 255, 255, 0.35);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Success State */
    .success-view {
      display: none;
      text-align: center;
      padding: 12px 0 8px 0;
      animation: successPop 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes successPop {
      0% { opacity: 0; transform: scale(0.92); }
      100% { opacity: 1; transform: scale(1); }
    }

    .success-icon-badge {
      width: 72px;
      height: 72px;
      margin: 0 auto 16px;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.4);
    }

    .success-icon-badge svg {
      width: 36px;
      height: 36px;
    }

    .success-name {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 26px;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.02em;
      line-height: 1.25;
      margin-bottom: 8px;
    }

    .success-badge-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #ecfdf5;
      color: #065f46;
      border: 1px solid #a7f3d0;
      font-size: 13px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 9999px;
      margin-bottom: 16px;
    }

    .success-message {
      font-size: 15px;
      color: #475569;
      line-height: 1.5;
      margin-bottom: 24px;
      background: #f8fafc;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px dashed #cbd5e1;
    }

    .whatsapp-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #059669;
      font-weight: 600;
    }

    .reset-btn {
      width: 100%;
      min-height: 48px;
      background: #f1f5f9;
      color: #334155;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      border: 1px solid #e2e8f0;
      border-radius: var(--radius);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background var(--transition), transform var(--transition);
      touch-action: manipulation;
    }

    .reset-btn:active {
      transform: scale(0.97);
      background: #e2e8f0;
    }

    .footer {
      margin-top: 24px;
      text-align: center;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.4);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="card" id="checkinCard">
      
      <!-- CHECK-IN FORM VIEW -->
      <div id="formView">
        <div class="header">
          <div class="event-badge">
            <span class="dot"></span>
            Freshers Event 2026
          </div>
          <h1 class="title">Alumni Check-In</h1>
          <p class="subtitle">Welcome back! Please verify your presence to get started.</p>
        </div>

        <form id="lookupForm" class="form-group" onsubmit="handleLookup(event)">
          <div class="input-wrapper">
            <input 
              type="text" 
              id="identifierInput" 
              class="input-field" 
              placeholder="Enter your email or phone number" 
              autocomplete="email tel"
              inputmode="email"
              required
              autofocus
            />
            <svg class="input-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
            </svg>
          </div>

          <!-- Red inline message below input -->
          <div id="errorAlert" class="error-alert" role="alert">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <span id="errorMessage">We couldn't find your details. Please check with the registration desk.</span>
          </div>

          <button type="submit" id="submitBtn" class="submit-btn">
            <span id="btnText">Check In</span>
            <span id="btnSpinner" class="spinner" aria-hidden="true"></span>
          </button>
        </form>
      </div>

      <!-- SUCCESS VIEW (Swapped upon match) -->
      <div id="successView" class="success-view">
        <div class="success-icon-badge">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
          </svg>
        </div>

        <div class="success-badge-tag">
          ✓ Verified Attendee
        </div>

        <h2 id="successName" class="success-name">Welcome, Friend! 🎉</h2>
        
        <p class="success-message">
          <span class="whatsapp-badge">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12.031 6.172c-3.181 0-5.767 2.586-5.768 5.766-.001 1.298.38 2.27 1.019 3.287l-.711 2.598 2.664-.698c.969.585 1.961.94 2.796.94 3.183 0 5.769-2.587 5.769-5.766.001-3.181-2.585-5.767-5.769-5.767zm7.625 5.766c-.001 4.209-3.42 7.627-7.625 7.627-.927 0-2.072-.259-2.909-.72l-3.957 1.038 1.057-3.864c-.534-.912-.816-1.954-.816-3.081.001-4.209 3.421-7.628 7.626-7.628 4.208 0 7.624 3.419 7.624 7.628z"/>
            </svg>
            WhatsApp
          </span><br>
          Check your WhatsApp for your welcome message.
        </p>

        <button type="button" class="reset-btn" onclick="resetForm()">
          Check In Another Person
        </button>
      </div>

    </div>

    <div class="footer">
      Alumni Relations • Freshers Event
    </div>
  </div>

  <script>
    const formView = document.getElementById('formView');
    const successView = document.getElementById('successView');
    const identifierInput = document.getElementById('identifierInput');
    const errorAlert = document.getElementById('errorAlert');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const btnSpinner = document.getElementById('btnSpinner');
    const successName = document.getElementById('successName');

    // Clear error message on new input
    identifierInput.addEventListener('input', () => {
      hideError();
    });

    function showError(message) {
      if (message) {
        document.getElementById('errorMessage').textContent = message;
      }
      errorAlert.style.display = 'flex';
      identifierInput.focus();
    }

    function hideError() {
      errorAlert.style.display = 'none';
    }

    function setLoading(isLoading) {
      if (isLoading) {
        submitBtn.disabled = true;
        btnText.style.display = 'none';
        btnSpinner.style.display = 'inline-block';
      } else {
        submitBtn.disabled = false;
        btnText.style.display = 'inline-block';
        btnSpinner.style.display = 'none';
      }
    }

    async function handleLookup(event) {
      event.preventDefault();
      hideError();

      const identifier = identifierInput.value.trim();
      if (!identifier) {
        showError('Please enter your email or phone number.');
        return;
      }

      setLoading(true);

      try {
        const response = await fetch('/api/lookup', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ identifier })
        });

        const data = await response.json();

        if (response.ok && data.found) {
          // Success: Swap card content for big centered success state
          showSuccess(data.name);
        } else {
          // Not found: red inline message below input, keep input visible to retry
          showError("We couldn't find your details. Please check with the registration desk.");
        }
      } catch (err) {
        console.error('Lookup request failed:', err);
        showError('Unable to connect to check-in server. Please try again.');
      } finally {
        setLoading(false);
      }
    }

    function showSuccess(name) {
      successName.textContent = `Welcome, ${name}! 🎉`;
      formView.style.display = 'none';
      successView.style.display = 'block';
    }

    function resetForm() {
      identifierInput.value = '';
      hideError();
      successView.style.display = 'none';
      formView.style.display = 'block';
      identifierInput.focus();
    }
  </script>
</body>
</html>
